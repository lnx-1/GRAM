### model
model_name_or_path: /root/autodl-tmp/mydpaper/model/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
lora_dropout: 0.05

### dataset
dataset: gram_ft_65k
template: qwen3
cutoff_len: 2048
max_samples: 20000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8
enable_thinking: false

### output
output_dir: saves/qwen3-8b/lora/vgrm-20k
logging_steps: 20
save_strategy: steps
save_steps: 300
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 16
gradient_accumulation_steps: 1
gradient_checkpointing: false
flash_attn: sdpa
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

## VGRM
vgrm_loss: true
gram_candidate_labels:
  - "A"
  - "B"
gram_label_smoothing: 0.1
vgrm_latent_dim: 64
vgrm_mc_samples: 4
vgrm_kl_weight: 1.0e-3
vgrm_kl_warmup_steps: 1000
vgrm_logvar_min: -8.0
vgrm_logvar_max: 4.0
